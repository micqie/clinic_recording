<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Medicines API</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h1>Test Medicines API</h1>
    <button onclick="testGetAll()">Test Get All Medicines</button>
    <button onclick="testGetForms()">Test Get Medicine Forms</button>
    <button onclick="testGetWeights()">Test Get Medicine Weights</button>

    <div id="results"></div>

    <script>
        const baseApiUrl = "http://localhost/clinic_recording/api";
        const medicineApiUrl = `${baseApiUrl}/medicines.php`;

        async function testGetAll() {
            try {
                console.log("Testing getAllMedicines...");
                const response = await axios.get(`${medicineApiUrl}?operation=getAll`);
                console.log("Response:", response.data);
                document.getElementById('results').innerHTML = `<pre>${JSON.stringify(response.data, null, 2)}</pre>`;
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('results').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }

        async function testGetForms() {
            try {
                console.log("Testing getMedicineForms...");
                const response = await axios.get(`${medicineApiUrl}?operation=getMedicineForms`);
                console.log("Response:", response.data);
                document.getElementById('results').innerHTML = `<pre>${JSON.stringify(response.data, null, 2)}</pre>`;
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('results').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }

        async function testGetWeights() {
            try {
                console.log("Testing getMedicineWeights...");
                const response = await axios.get(`${medicineApiUrl}?operation=getMedicineWeights`);
                console.log("Response:", response.data);
                document.getElementById('results').innerHTML = `<pre>${JSON.stringify(response.data, null, 2)}</pre>`;
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('results').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
