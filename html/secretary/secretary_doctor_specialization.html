  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" >

  <link rel="stylesheet" href="../../css/dashboard.css">

  <nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="main-navbar">

      </a>
      <div class="dropdown ms-auto">
        <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="fas fa-user-circle fa-2x text-primary me-2"></i>
          <span class="fw-semibold">Admin</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="adminDropdown">
          <li>
            <button type="button" class="dropdown-item text-danger" id="logoutBtn">
              <i class="fas fa-sign-out-alt me-2"></i> Logout
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="d-flex">
    <nav id="sidebar-wrapper" role="navigation" aria-label="Sidebar menu" tabindex="0">
      <div class="list-group list-group-flush">
        <a href="secretary_dashboard.html" class="list-group-item list-group-item-action py-3 ripple">
          <i class="fas fa-tachometer-alt me-2" aria-hidden="true"></i>Dashboard
        </a>
        <a href="secretary_patients.html" class="list-group-item list-group-item-action py-3 ripple">
          <i class="fa-solid fa-people-group me-2" aria-hidden="true"></i>Registered Patients
        </a>

        <a class="list-group-item list-group-item-action py-3 ripple" data-bs-toggle="collapse" href="#doctorSubmenu" role="button" aria-expanded="true" aria-controls="doctorSubmenu">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <i class="fa-solid fa-user-doctor me-2" aria-hidden="true"></i>Doctors
            </div>
            <i class="fas fa-chevron-down fa-xs"></i>
          </div>
        </a>
        <div class="collapse show" id="doctorSubmenu">
          <div class="list-group list-group-flush">
            <a href="secretary_doctors.html" class="list-group-item list-group-item-action py-2 ripple ps-4">
              <i class="fa-solid fa-list me-2" aria-hidden="true"></i>Doctor List
            </a>

            <a href="secretary_doctor_specialization.html" class="list-group-item list-group-item-action py-2 ripple ps-4 active">
              <i class="fa-solid fa-star me-2" aria-hidden="true"></i>Specializations
            </a>
          </div>
        </div>

        <a href="secretary_medicine.html" class="list-group-item list-group-item-action py-3 ripple">
          <i class="fa-solid fa-pills me-2" aria-hidden="true"></i>Medicines
        </a>
        <a href="secretary_payments.html" class="list-group-item list-group-item-action py-3 ripple">
          <i class="fa-solid fa-credit-card me-2" aria-hidden="true"></i>Payments
        </a>
        <a href="secretary_appointments.html" class="list-group-item list-group-item-action py-3 ripple">
          <i class="fa-solid fa-calendar-check me-2" aria-hidden="true"></i>Appointments
        </a>
        <a href="secretary_lab_requests.html" class="list-group-item list-group-item-action py-3 ripple">

        </a>
        <a href="secretary_lab_results.html" class="list-group-item list-group-item-action py-3 ripple">
          <i class="fa-solid fa-file-medical me-2" aria-hidden="true"></i>Lab Results
        </a>
      </div>

    <main id="page-content-wrapper" class="pt-5" tabindex="-1">
      <button class="btn btn-primary d-lg-none offcanvas-toggle-btn" type="button" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>

      <div class="content-container mt-5 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="fw-bold text-secondary">Specializations</h1>
        </div>

        <div class="card border-0 shadow-sm mb-4">
          <div class="card-body">
            <form id="specForm" class="row g-3">
              <div class="col-md-4">
                <label class="form-label">Name</label>
                <input type="text" id="specName" class="form-control" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Description</label>
                <input type="text" id="specDesc" class="form-control" />
              </div>
              <div class="col-md-2 d-flex align-items-end">
                <button class="btn btn-primary w-100" type="submit">
                  <i class="fas fa-plus me-2"></i>Add
                </button>
              </div>
            </form>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <ul class="list-group" id="specList"></ul>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const baseApiUrl = sessionStorage.getItem('baseAPIUrl') || 'http://localhost/clinic_recording/api';
      const listEl = document.getElementById('specList');
      const form = document.getElementById('specForm');
      const nameEl = document.getElementById('specName');
      const descEl = document.getElementById('specDesc');

      async function load() {
        try {
          const res = await axios.get(`${baseApiUrl}/specializations.php?operation=listSpecializations`);
          const rows = res.data.data || [];
          listEl.innerHTML = '';
          if (!rows.length) {
            listEl.innerHTML = '<li class="list-group-item text-muted">No specializations yet</li>';
            return;
          }
          rows.forEach(r => {
            const li = document.createElement('li');
            li.className = 'list-group-item';
            li.innerHTML = `
              <div class="d-flex justify-content-between align-items-start gap-2">
                <div>
                  <div class="fw-semibold">${r.name}</div>
                  <div class="text-muted small">${r.description || ''}</div>
                </div>
                <div class="btn-group btn-group-sm">
                  <button class="btn btn-outline-primary" data-edit="${r.specialization_id}"><i class="fas fa-edit"></i></button>
                  <button class="btn btn-outline-danger" data-delete="${r.specialization_id}"><i class="fas fa-trash"></i></button>
                </div>
              </div>`;
            listEl.appendChild(li);
          });
        } catch (e) {
          Swal.fire('Error', 'Failed to load specializations', 'error');
        }
      }

      form?.addEventListener('submit', async (e) => {
        e.preventDefault();
        const payload = new FormData();
        payload.append('operation', 'addSpecialization');
        payload.append('name', nameEl.value.trim());
        payload.append('description', descEl.value.trim());
        try {
          const res = await axios.post(`${baseApiUrl}/specializations.php`, payload);
          if (res.data.success) {
            nameEl.value = '';
            descEl.value = '';
            load();
            Swal.fire('Added', 'Specialization added', 'success');
          } else {
            Swal.fire('Error', res.data.message || 'Failed to add', 'error');
          }
        } catch (e) {
          Swal.fire('Error', e.message, 'error');
        }
      });

      listEl.addEventListener('click', async (e) => {
        const editId = e.target.closest('button[data-edit]')?.getAttribute('data-edit');
        const delId = e.target.closest('button[data-delete]')?.getAttribute('data-delete');
        if (editId) {
          const name = prompt('New name:');
          if (!name) return;
          const description = prompt('New description:') || '';
          const fd = new FormData();
          fd.append('operation', 'updateSpecialization');
          fd.append('specialization_id', editId);
          fd.append('name', name);
          fd.append('description', description);
          const res = await axios.post(`${baseApiUrl}/specializations.php`, fd);
          if (res.data.success) { load(); } else { Swal.fire('Error', res.data.message || 'Update failed', 'error'); }
          return;
        }
        if (delId) {
          const ok = await Swal.fire({ icon: 'warning', title: 'Delete specialization?', showCancelButton: true });
          if (!ok.isConfirmed) return;
          const fd = new FormData();
          fd.append('operation', 'deleteSpecialization');
          fd.append('specialization_id', delId);
          const res = await axios.post(`${baseApiUrl}/specializations.php`, fd);
          if (res.data.success) { load(); } else { Swal.fire('Error', res.data.message || 'Delete failed', 'error'); }
        }
      });

      load();
    });
  </script>
</body>
</html>
