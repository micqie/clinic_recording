<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Doctor - Diagnoses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="../../css/dashboard.css">
  <link rel="stylesheet" href="../../css/table.css">
  <link rel="icon" href="../../logo/apple-touch-icon.png" type="image/x-icon" />
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../../js/doctor_diagnoses.js" defer></script>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="main-navbar">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <i class="fas fa-stethoscope me-2 fs-3 text-primary"></i>
        <span class="fs-4 fw-bold text-primary">MCSTUFFIN's</span>
      </a>
      <div class="dropdown ms-auto">
        <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" data-bs-toggle="dropdown">
          <i class="fas fa-user-circle fa-2x text-primary me-2"></i>
          <span class="fw-semibold">Doctor</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><button type="button" class="dropdown-item text-danger" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i> Logout</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="d-flex">
    <nav id="sidebar-wrapper" role="navigation" aria-label="Sidebar menu" tabindex="0">
      <div class="list-group list-group-flush">
        <a href="doctor_dashboard.html" class="list-group-item list-group-item-action py-3 ripple">
          <i class="fas fa-tachometer-alt me-2"></i>Dashboard
        </a>
        <a href="doctor_profile.html" class="list-group-item list-group-item-action py-3 ripple">
          <i class="fas fa-user-edit me-2"></i>My Profile
        </a>
        <a href="doctor_appointments.html" class="list-group-item list-group-item-action py-3 ripple">
          <i class="fa-solid fa-calendar-check me-2"></i>My Appointments
        </a>
        <a href="doctor_consultations.html" class="list-group-item list-group-item-action py-3 ripple">
          <i class="fa-solid fa-user-doctor me-2"></i>Consultations
        </a>
        <a href="doctor_patients.html" class="list-group-item list-group-item-action py-3 ripple">
          <i class="fa-solid fa-people-group me-2"></i>My Patients
        </a>

        <a href="doctor_diagnoses.html" class="list-group-item list-group-item-action py-3 ripple active" aria-current="page">
          <i class="fa-solid fa-notes-medical me-2"></i>Diagnoses
        </a>
      </div>
    </nav>

    <main id="page-content-wrapper" class="pt-5" tabindex="-1">
      <button class="btn btn-primary d-lg-none offcanvas-toggle-btn" type="button" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
      <div class="content-container mt-5 p-4">
        <div class="d-flex align-items-center justify-content-between mb-3">
          <h1 class="fw-bold text-secondary">Diagnoses</h1>
        </div>

        <div class="card border-0 shadow-sm mb-4">
          <div class="card-header bg-primary text-white"><strong>Add Diagnosis</strong></div>
          <div class="card-body">
            <form id="addDiagnosisForm" class="row g-3 needs-validation" novalidate>
              <div class="col-md-6">
                <label class="form-label">Patient</label>
                <select id="patient_id" class="form-select" required></select>
                <div class="invalid-feedback">Please select a patient.</div>
              </div>
              <div class="col-md-6">
                <label class="form-label">Appointment</label>
                <select id="appointment_id" class="form-select" required></select>
                <div class="invalid-feedback">Please select an appointment.</div>
              </div>
              <div class="col-md-8">
                <label class="form-label">Condition</label>
                <div class="input-group">
                  <select id="condition_id" class="form-select" required></select>
                  <button type="button" class="btn btn-outline-secondary" id="quickAddCondition"><i class="fa-solid fa-plus"></i></button>
                </div>
                <div class="invalid-feedback">Please select a condition.</div>
              </div>
              <div class="col-md-4">
                <label class="form-label">Severity</label>
                <select id="severity" class="form-select" required>
                  <option value="">Select</option>
                  <option value="Mild">Mild</option>
                  <option value="Moderate">Moderate</option>
                  <option value="Severe">Severe</option>
                  <option value="Critical">Critical</option>
                </select>
                <div class="invalid-feedback">Please select severity.</div>
              </div>
              <div class="col-12">
                <label class="form-label">Notes</label>
                <textarea id="notes" class="form-control" rows="3" placeholder="Optional notes..."></textarea>
              </div>
              <div class="col-12 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>Save Diagnosis</button>
                <button type="reset" class="btn btn-secondary">Clear</button>
              </div>
            </form>
          </div>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-header bg-light"><strong>Recent Diagnoses</strong></div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="custom-table">
                <thead>
                  <tr>
                    <th>Patient</th>
                    <th>Condition</th>
                    <th>Severity</th>
                    <th>Date</th>
                  </tr>
                </thead>
                <tbody id="diagnosesTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
