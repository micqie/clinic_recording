<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h4 class="mb-3 text-center">Change Your Password</h4>
            <p class="text-muted small text-center mb-4">For security, please update your password before continuing.</p>

            <form id="forceChangeForm" novalidate>
              <div class="mb-3">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-control" name="current_password" required>
              </div>
              <div class="mb-1">
                <label class="form-label">New Password</label>
                <input type="password" class="form-control" name="new_password" required>
              </div>
              <div id="passwordStrength" class="form-text mb-3"></div>
              <div class="mb-3">
                <label class="form-label">Confirm New Password</label>
                <input type="password" class="form-control" name="confirm_password" required>
              </div>

              <div class="d-grid">
                <button type="submit" class="btn btn-primary">Update Password</button>
              </div>
            </form>
          </div>
        </div>
        <div class="text-center mt-3">
          <a href="/clinic_recording/index.html" class="small">Back to home</a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="/clinic_recording/js/change_password.js"></script>
</body>
<script>
  // Optional: set base API URL if not already set by app entry page
  if (!sessionStorage.getItem('baseAPIUrl')) {
    sessionStorage.setItem('baseAPIUrl', 'http://localhost/clinic_recording/api');
  }
</script>
</html>
