<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link href="../../css/dashboard.css" rel="stylesheet" />
  <link href="../../css/table.css" rel="stylesheet" />
  <link rel="icon" type="image/x-icon" href="../../logo/favicon.ico" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="main-navbar">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center" href="#">
      <i class="fas fa-stethoscope me-2 fs-3 text-primary"></i>
      <span class="fs-4 fw-bold text-primary">MCSTUFFIN's</span>
    </a>
    <div class="dropdown ms-auto">
      <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="fas fa-user-circle fa-2x text-primary me-2"></i>
        <span class="fw-semibold">Admin</span>
      </a>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="adminDropdown">
        <li><a class="dropdown-item" href="admin_dashboard.html">Dashboard</a></li>
        <li><a class="dropdown-item" href="admin_doctors.html">Doctors</a></li>
        <li><a class="dropdown-item" href="admin_patients.html">Patients</a></li>
        <li><a class="dropdown-item" href="admin_secretaries.html">Secretaries</a></li>
        <li><hr class="dropdown-divider"/></li>
        <li><button type="button" class="dropdown-item text-danger" id="logoutBtn"><i class="fas fa-sign-out-alt me-2"></i> Logout</button></li>
      </ul>
    </div>
  </div>
</nav>

<div class="d-flex">
  <nav id="sidebar-wrapper" role="navigation" aria-label="Sidebar menu" tabindex="0">
    <div class="list-group list-group-flush">
      <a href="admin_dashboard.html" class="list-group-item list-group-item-action py-3 ripple">
        <i class="fas fa-tachometer-alt me-2" aria-hidden="true"></i>Dashboard
      </a>
      <a href="admin_doctors.html" class="list-group-item list-group-item-action py-3 ripple">
        <i class="fa-solid fa-user-doctor me-2" aria-hidden="true"></i>Doctors
      </a>
      <a href="admin_specializations.html" class="list-group-item list-group-item-action py-3 ripple active" aria-current="page">
        <i class="fa-solid fa-star me-2" aria-hidden="true"></i>Specializations
      </a>
      <a href="admin_patients.html" class="list-group-item list-group-item-action py-3 ripple">
        <i class="fa-solid fa-people-group me-2" aria-hidden="true"></i>Patients
      </a>
      <a href="admin_secretaries.html" class="list-group-item list-group-item-action py-3 ripple">
        <i class="fa-solid fa-user-tie me-2" aria-hidden="true"></i>Secretaries
      </a>
    </div>
  </nav>

  <main id="page-content-wrapper" class="pt-5" tabindex="-1">
    <div class="content-container mt-5 p-4 container-fluid">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">Doctor Specializations</h3>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAdd">Add Specialization</button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
              <thead><tr><th>#</th><th>Name</th><th>Description</th><th>Actions</th></tr></thead>
              <tbody id="tbl-specs"><tr><td colspan="4" class="text-center text-muted">Loading...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add Modal -->
<div class="modal fade" id="modalAdd" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Add Specialization</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="row g-2">
          <div class="col-12"><input id="spec-name" class="form-control" placeholder="Name" /></div>
          <div class="col-12"><textarea id="spec-desc" class="form-control" placeholder="Description (optional)"></textarea></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button id="btn-add-spec" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const baseApiUrl = sessionStorage.getItem('baseAPIUrl') || 'http://localhost/clinic_recording/api';

  async function load(){
    const res = await fetch(`${baseApiUrl}/specializations.php?operation=listSpecializations`);
    const data = await res.json();
    const tbody = document.getElementById('tbl-specs');
    const rows = Array.isArray(data?.data) ? data.data : [];
    if(!rows.length){ tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No specializations</td></tr>'; return; }
    tbody.innerHTML = rows.map((s,i)=>{
      return `<tr>
        <td>${i+1}</td>
        <td>${s.name||''}</td>
        <td>${s.description||''}</td>
        <td><button class=\"btn btn-sm btn-outline-danger\" data-id=\"${s.specialization_id}\">Delete</button></td>
      </tr>`;
    }).join('');
    tbody.querySelectorAll('button[data-id]').forEach(btn=>{
      btn.addEventListener('click', async (e)=>{
        const id = e.currentTarget.getAttribute('data-id');
        const fd = new FormData();
        fd.append('operation','deleteSpecialization');
        fd.append('specialization_id', id);
        await fetch(`${baseApiUrl}/specializations.php`, { method:'POST', body: fd });
        load();
      });
    });
  }

  document.getElementById('btn-add-spec').addEventListener('click', async ()=>{
    const name = document.getElementById('spec-name').value.trim();
    const desc = document.getElementById('spec-desc').value;
    if(!name){ alert('Name required'); return; }
    const fd = new FormData();
    fd.append('operation','addSpecialization');
    fd.append('name', name);
    fd.append('description', desc);
    await fetch(`${baseApiUrl}/specializations.php`, { method:'POST', body: fd });
    document.querySelector('#modalAdd .btn-close').click();
    load();
  });

  load();
})();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
<script src="../../js/logout.js" defer></script>
<script src="../../js/auto-logout.js" defer></script>
</body>
</html>
