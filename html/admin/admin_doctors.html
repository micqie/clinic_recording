    <main id="page-content-wrapper" class="pt-5" tabindex="-1">
      <button class="btn btn-primary d-lg-none offcanvas-toggle-btn" type="button" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>

      <div class="content-container mt-5 p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <h1 class="fw-bold text-secondary">Doctor Management</h1>
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addDoctorModal">
            <i class="fas fa-plus me-2"></i>Add New Doctor
          </button>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover" id="doctorsTable">
                <thead class="table-light">
                  <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>License Number</th>
                    <th>Specialization</th>
                    <th>Experience</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="doctorsTableBody">
                  <!-- Data will be loaded here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add Doctor Modal -->
  <div class="modal fade" id="addDoctorModal" tabindex="-1" aria-labelledby="addDoctorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addDoctorModalLabel">Add New Doctor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="addDoctorForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="doctorName" class="form-label">Full Name *</label>
                <input type="text" class="form-control" id="doctorName" name="name" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="doctorEmail" class="form-label">Email *</label>
                <input type="email" class="form-control" id="doctorEmail" name="email" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="doctorPassword" class="form-label">Password *</label>
                <input type="password" class="form-control" id="doctorPassword" name="password" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="doctorLicense" class="form-label">License Number *</label>
                <input type="text" class="form-control" id="doctorLicense" name="license_number" required>
              </div>
            </div>
            <div class="row">
                             <div class="col-md-6 mb-3">
                <label for="doctorSpecialization" class="form-label">Specialization *</label>
 <select class="form-control" id="doctorSpecialization" name="specialization_id" required>
   <option value="">-- Select Specialization --</option>
 </select>
               </div>
              <div class="col-md-6 mb-3">
                <label for="doctorExperience" class="form-label">Years of Experience</label>
                <input type="number" class="form-control" id="doctorExperience" name="years_experience" min="0" max="50">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveDoctorBtn">Save Doctor</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Edit Doctor Modal -->
  <div class="modal fade" id="editDoctorModal" tabindex="-1" aria-labelledby="editDoctorModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editDoctorModalLabel">Edit Doctor</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="editDoctorForm">
            <input type="hidden" id="editDoctorId" name="doctor_id">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="editDoctorName" class="form-label">Full Name *</label>
                <input type="text" class="form-control" id="editDoctorName" name="name" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="editDoctorEmail" class="form-label">Email *</label>
                <input type="email" class="form-control" id="editDoctorEmail" name="email" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="editDoctorLicense" class="form-label">License Number *</label>
                <input type="text" class="form-control" id="editDoctorLicense" name="license_number" required>
              </div>
              <div class="col-md-6 mb-3">
                <label for="editDoctorSpecialization" class="form-label">Specialization *</label>
                <select class="form-control" id="editDoctorSpecialization" name="specialization_id" required>
                  <option value="">-- Select Specialization --</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="editDoctorExperience" class="form-label">Years of Experience</label>
                <input type="number" class="form-control" id="editDoctorExperience" name="years_experience" min="0" max="50">
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="updateDoctorBtn">Update Doctor</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="../../js/secretary_doctors.js" defer></script>
</body>

</html>
