</head>
<body>

  <div class="container-fluid">

      <i class="fas fa-stethoscope me-2 fs-3 text-primary"></i>
      <span class="fs-4 fw-bold text-primary">MCSTUFFIN's</span>
    </a>
    <div class="dropdown ms-auto">
      <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="fas fa-user-circle fa-2x text-primary me-2"></i>

      </a>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="adminDropdown">
        <li>
          <button type="button" class="dropdown-item text-danger" id="logoutBtn">

  </div>
</nav>

<div class="d-flex">
  <nav id="sidebar-wrapper" role="navigation" aria-label="Sidebar menu" tabindex="0">
    <div class="list-group list-group-flush">
      <a href="admin_dashboard.html" class="list-group-item list-group-item-action py-3 ripple">
        <i class="fas fa-tachometer-alt me-2" aria-hidden="true"></i>Dashboard
      </a>

      <a href="admin_doctors.html" class="list-group-item list-group-item-action py-3 ripple">
        <i class="fa-solid fa-user-doctor me-2" aria-hidden="true"></i>Doctors
      </a>
      <a href="admin_secretaries.html" class="list-group-item list-group-item-action py-3 ripple active" aria-current="page">
        <i class="fa-solid fa-user-tie me-2" aria-hidden="true"></i>Secretaries
      </a>
      <a href="admin_patients.html" class="list-group-item list-group-item-action py-3 ripple">
        <i class="fa-solid fa-people-group me-2" aria-hidden="true"></i>Patients
      </a>

        <i class="fa-solid fa-chart-line me-2" aria-hidden="true"></i>Reports

    </div>
  </nav>

  <main id="page-content-wrapper" class="pt-5" tabindex="-1">
    <button class="btn btn-primary d-lg-none offcanvas-toggle-btn" type="button" aria-label="Toggle menu">
      <i class="fas fa-bars"></i>
    </button>

    <div class="content-container mt-5 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold text-secondary">Secretary Management</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAdd">
          <i class="fas fa-plus me-2"></i>Add Secretary
        </button>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <table class="custom-table" id="secretariesTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Employee ID</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="tbl-secretaries"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add Modal -->
<div class="modal fade" id="modalAdd" tabindex="-1" aria-labelledby="addSecretaryLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <form id="addSecretaryForm" class="modal-content needs-validation" novalidate>
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Add Secretary</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12 col-md-6">
            <label class="form-label">Name</label>
            <input type="text" id="sec-name" class="form-control" placeholder="Name" required />
            <div class="invalid-feedback">Please enter secretary name.</div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Email</label>
            <input type="email" id="sec-email" class="form-control" placeholder="Email" required pattern="^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$" title="Please enter a valid email address (e.g., name@example.com)" />
            <div class="invalid-feedback">Please enter a valid email.</div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Password</label>
            <input type="password" id="sec-pass" class="form-control" placeholder="Temp Password" value="password123" required />
            <div class="invalid-feedback">Please enter password.</div>
          </div>
          <div class="col-12 col-md-6">
            <label class="form-label">Employee ID</label>
            <input type="text" id="sec-empid" class="form-control" placeholder="Employee ID (optional)" />
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" id="btn-add-secretary" class="btn btn-primary">Save Secretary</button>
      </div>
    </form>
  </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script>
      (function(){
        const baseApiUrl = sessionStorage.getItem("baseAPIUrl") || "http://localhost/clinic_recording/api";
        const userRaw = sessionStorage.getItem("user");
        let user = null; try { user = JSON.parse(userRaw || '{}'); } catch (e) {}
        if (!user || (user.role||'').toLowerCase() !== 'admin') {
          Swal.fire({icon:'error', title:'Not Authorized', text:'Admin access required.'}).then(()=>{ window.location.href='../../index.html'; });
          return;
        }

        async function load(){
          const resp = await axios.get(`${baseApiUrl}/admin_users.php?operation=list_users&role=secretary`);
          const rows = Array.isArray(resp.data?.users) ? resp.data.users : [];
          const tbody = document.getElementById('tbl-secretaries');
          if(!rows.length){ tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No secretaries</td></tr>'; return; }
          tbody.innerHTML = rows.map((u)=>{
            const active = (u.is_active? 'Active':'Inactive');
            const badge = `<span class=\"badge ${u.is_active? 'bg-success':'bg-secondary'}\">${active}</span>`;
            const btn = u.is_active ?
              `<button class=\"btn btn-warning btn-sm\" data-id=\"${u.user_id}\" data-active=\"0\" title=\"Deactivate\">
                <i class=\"fas fa-user-slash text-dark\"></i>
              </button>` :
              `<button class=\"btn btn-success btn-sm\" data-id=\"${u.user_id}\" data-active=\"1\" title=\"Activate\">
                <i class=\"fas fa-user-check text-white\"></i>
              </button>`;
            return `<tr>
              <td>${u.name||''}</td>
              <td>${u.email||''}</td>
              <td><span class=\"badge bg-info\">${u.employee_id || '-'}</span></td>
              <td>${badge}</td>
              <td>${btn}</td>
            </tr>`;
          }).join('');
          tbody.querySelectorAll('button[data-id]').forEach(btn=>{
            btn.addEventListener('click', async (e)=>{
              const id = e.currentTarget.getAttribute('data-id');
              const active = e.currentTarget.getAttribute('data-active');
              const actionText = active === '1' ? 'activate' : 'deactivate';
              const result = await Swal.fire({
                title: `Confirm ${actionText}`,
                text: `Are you sure you want to ${actionText} this account?`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes',
                cancelButtonText: 'Cancel'
              });
              if (!result.isConfirmed) return;
              const payload = new FormData();
              payload.append('operation','set_active');
              payload.append('json', JSON.stringify({ user_id: parseInt(id,10), is_active: parseInt(active,10) }));
              try {
                Swal.fire({title:'Updating...', allowOutsideClick:false, didOpen:()=>Swal.showLoading()});
                const resp = await axios.post(`${baseApiUrl}/admin_users.php`, payload);
                if(resp.data?.success){ Swal.close(); await load(); Swal.fire('Updated','Status changed successfully','success'); }
                else { Swal.fire('Error', resp.data?.message || 'Update failed', 'error'); }
              } catch(err){ Swal.fire('Error', 'Update failed', 'error'); }
            });
          });
        }

        document.getElementById('btn-add-secretary').addEventListener('click', async ()=>{
          const name = document.getElementById('sec-name').value.trim();
          const email = document.getElementById('sec-email').value.trim();
          const pass = document.getElementById('sec-pass').value;
          if (!name || !email || !pass) { Swal.fire('Missing fields','Name, Email and Password are required.','warning'); return; }
          const payload = new FormData();
          payload.append('operation','create_user');
          payload.append('json', JSON.stringify({
            role: 'secretary',
            name: name,
            email: email,
            password: pass,
            employee_id: document.getElementById('sec-empid').value || null
          }));
          try {
            Swal.fire({title:'Saving...', allowOutsideClick:false, didOpen:()=>Swal.showLoading()});
            const resp = await axios.post(`${baseApiUrl}/admin_users.php`, payload);
            Swal.close();
            if (resp.data?.success) { Swal.fire('Success','Secretary created','success'); document.querySelector('#modalAdd .btn-close').click(); load(); }
            else { Swal.fire('Error', resp.data?.message||'Failed','error'); }
          } catch(err){ Swal.fire('Error','Failed to save','error'); }
        });

        load();
      })();
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar-wrapper');
            const toggleBtn = document.querySelector('.offcanvas-toggle-btn');

            toggleBtn?.addEventListener('click', () => {
                sidebar.classList.toggle('show');
            });

            // Optional: Close sidebar on clicking outside on small screens
            document.addEventListener('click', (e) => {
                if (
                    window.innerWidth <= 991.98 &&
                    sidebar.classList.contains('show') &&
                    !sidebar.contains(e.target) &&
                    !toggleBtn.contains(e.target)
                ) {
                    sidebar.classList.remove('show');
                }
            });
        });
    </script>
    <script src="../../js/logout.js" defer></script>
    <script src="../../js/auto-logout.js" defer></script>
</body>
