<html lang="en">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

      <i class="fas fa-stethoscope me-2 fs-3 text-primary"></i>

    </a>
    <div class="dropdown ms-auto">
      <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" id="adminDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="fas fa-user-circle fa-2x text-primary me-2"></i>
        <span class="fw-semibold">Admin</span>
      </a>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="adminDropdown">
        <li><a class="dropdown-item" href="admin_dashboard.html">Dashboard</a></li>

</nav>

<div class="d-flex">
  <nav id="sidebar-wrapper" role="navigation" aria-label="Sidebar menu" tabindex="0">
    <div class="list-group list-group-flush">
      <a href="admin_dashboard.html" class="list-group-item list-group-item-action py-3 ripple">
        <i class="fas fa-tachometer-alt me-2" aria-hidden="true"></i>Dashboard
      </a>
      <a href="admin_users.html" class="list-group-item list-group-item-action py-3 ripple active" aria-current="page">
        <i class="fa-solid fa-users-gear me-2" aria-hidden="true"></i>User Management
      </a>
      <a href="admin_reports.html" class="list-group-item list-group-item-action py-3 ripple">
        <i class="fa-solid fa-chart-line me-2" aria-hidden="true"></i>Reports
      </a>
    </div>
  </nav>

  <main id="page-content-wrapper" class="pt-5" tabindex="-1">
  <div class="content-container mt-5 p-4 container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="m-0">User Management</h3>
        <div>
            <a href="admin_dashboard.html" class="btn btn-outline-secondary">Dashboard</a>
            <a href="admin_reports.html" class="btn btn-outline-secondary">Reports</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-header">
            <ul class="nav nav-tabs card-header-tabs" id="userTabs" role="tablist">
                <li class="nav-item" role="presentation">
                  <button class="nav-link active" id="tab-all" data-bs-toggle="tab" data-bs-target="#pane-all" type="button" role="tab">All</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="tab-doctors" data-bs-toggle="tab" data-bs-target="#pane-doctors" type="button" role="tab">Doctors</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="tab-secretaries" data-bs-toggle="tab" data-bs-target="#pane-secretaries" type="button" role="tab">Secretaries</button>
                </li>
                <li class="nav-item" role="presentation">
                  <button class="nav-link" id="tab-patients" data-bs-toggle="tab" data-bs-target="#pane-patients" type="button" role="tab">Patients</button>
                </li>
                <li class="ms-auto">
                  <button id="btn-refresh" class="btn btn-sm btn-primary">Refresh</button>
                </li>
            </ul>
        </div>
        <div class="card-body tab-content">
            <div class="tab-pane fade show active" id="pane-all" role="tabpanel" aria-labelledby="tab-all">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="tbl-users">
                    <tr><td colspan="6" class="text-center text-muted">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
            </div>

            <div class="tab-pane fade" id="pane-doctors" role="tabpanel" aria-labelledby="tab-doctors">
              <div class="row g-3 mb-3">
                <div class="col-md-3"><input id="doc-name" class="form-control" placeholder="Name" /></div>
                <div class="col-md-3"><input id="doc-email" class="form-control" placeholder="Email" /></div>
                <div class="col-md-3"><input id="doc-pass" class="form-control" placeholder="Temp Password" value="password123" /></div>
                <div class="col-md-3"><input id="doc-license" class="form-control" placeholder="License #" /></div>
                <div class="col-md-3"><input id="doc-spec" class="form-control" placeholder="Specialization ID (optional)" /></div>
                <div class="col-md-3"><input id="doc-years" class="form-control" placeholder="Years Experience (optional)" /></div>
                <div class="col-md-3"><button id="btn-add-doctor" class="btn btn-success w-100">Add Doctor</button></div>
              </div>
              <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                  <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
                  <tbody id="tbl-doctors"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
              </div>
            </div>

            <div class="tab-pane fade" id="pane-secretaries" role="tabpanel" aria-labelledby="tab-secretaries">
              <div class="row g-3 mb-3">
                <div class="col-md-3"><input id="sec-name" class="form-control" placeholder="Name" /></div>
                <div class="col-md-3"><input id="sec-email" class="form-control" placeholder="Email" /></div>
                <div class="col-md-3"><input id="sec-pass" class="form-control" placeholder="Temp Password" value="password123" /></div>
                <div class="col-md-3"><input id="sec-empid" class="form-control" placeholder="Employee ID (optional)" /></div>
                <div class="col-md-3"><button id="btn-add-secretary" class="btn btn-success w-100">Add Secretary</button></div>
              </div>
              <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                  <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
                  <tbody id="tbl-secretaries"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
              </div>
            </div>

            <div class="tab-pane fade" id="pane-patients" role="tabpanel" aria-labelledby="tab-patients">
              <div class="row g-3 mb-3">
                <div class="col-md-3"><input id="pat-name" class="form-control" placeholder="Name" /></div>
                <div class="col-md-3"><input id="pat-email" class="form-control" placeholder="Email" /></div>
                <div class="col-md-3"><input id="pat-pass" class="form-control" placeholder="Temp Password" value="password123" /></div>
                <div class="col-md-3"><input id="pat-contact" class="form-control" placeholder="Contact (optional)" /></div>
                <div class="col-md-3"><input id="pat-bdate" type="date" class="form-control" placeholder="Birthdate (optional)" /></div>
                <div class="col-md-3"><input id="pat-address" class="form-control" placeholder="Address (optional)" /></div>
                <div class="col-md-3"><button id="btn-add-patient" class="btn btn-success w-100">Add Patient</button></div>
              </div>
              <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                  <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Status</th><th>Actions</th></tr></thead>
                  <tbody id="tbl-patients"><tr><td colspan="5" class="text-center text-muted">Loading...</td></tr></tbody>
                </table>
              </div>
            </div>
        </div>
    </div>
  </div>
  </main>
</div>

<script>
  (function(){
    const baseApiUrl = sessionStorage.getItem("baseAPIUrl") || "http://localhost/clinic_recording/api";
    const userRaw = sessionStorage.getItem("user");
    let user = null; try { user = JSON.parse(userRaw || '{}'); } catch (e) {}
    if (!user || (user.role||'').toLowerCase() !== 'admin') {
      Swal.fire({icon:'error', title:'Not Authorized', text:'Admin access required.'}).then(()=>{ window.location.href='../../index.html'; });
      return;
    }

    async function loadUsers(){
      try{
        const resp = await axios.get(`${baseApiUrl}/admin_users.php?operation=list_users`);
        const rows = Array.isArray(resp.data?.users) ? resp.data.users : [];
        render(rows);
        await Promise.all([
          loadRole('doctor', 'tbl-doctors'),
          loadRole('secretary', 'tbl-secretaries'),
          loadRole('patient', 'tbl-patients')
        ]);
      }catch(e){
        document.getElementById('tbl-users').innerHTML = '<tr><td colspan="6" class="text-center text-muted">Failed to load users</td></tr>';
      }
    }

    async function loadRole(role, tableId){
      try{
        const resp = await axios.get(`${baseApiUrl}/admin_users.php?operation=list_users&role=${encodeURIComponent(role)}`);
        const rows = Array.isArray(resp.data?.users) ? resp.data.users : [];
        const tbody = document.getElementById(tableId);
        if(!tbody) return;
        if(!rows.length){ tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No data</td></tr>'; return; }
        tbody.innerHTML = rows.map((u,i)=>{
          const active = (u.is_active? 'Active':'Inactive');
          const btn = u.is_active ? `<button class=\"btn btn-sm btn-outline-danger\" data-id=\"${u.user_id}\" data-active=\"0\">Deactivate</button>` : `<button class=\"btn btn-sm btn-outline-success\" data-id=\"${u.user_id}\" data-active=\"1\">Activate</button>`;
          return `<tr><td>${i+1}</td><td>${u.name||''}</td><td>${u.email||''}</td><td>${active}</td><td>${btn}</td></tr>`;
        }).join('');
        tbody.querySelectorAll('button[data-id]').forEach(btn=>{
          btn.addEventListener('click', async (e)=>{
            const id = e.currentTarget.getAttribute('data-id');
            const active = e.currentTarget.getAttribute('data-active');
            await setActive(id, active);
          });
        });
      }catch(e){
        const tbody = document.getElementById(tableId);
        if (tbody) tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Failed</td></tr>';
      }
    }

    async function setActive(id, active){
      try{
        const payload = new FormData();
        payload.append('operation','set_active');
        payload.append('json', JSON.stringify({ user_id: parseInt(id,10), is_active: parseInt(active,10) }));
        const resp = await axios.post(`${baseApiUrl}/admin_users.php`, payload);
        if(resp.data?.success){ await loadUsers(); }
        else { Swal.fire('Error', resp.data?.message || 'Update failed', 'error'); }
      }catch(err){ Swal.fire('Error', 'Update failed', 'error'); }
    }

    function render(users){
      const tbody = document.getElementById('tbl-users');
      if(!users.length){ tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted">No users</td></tr>'; return; }
      tbody.innerHTML = users.map((u,i)=>{
        const active = (u.is_active? 'Active':'Inactive');
        const btn = u.is_active ? `<button class="btn btn-sm btn-outline-danger" data-id="${u.user_id}" data-active="0">Deactivate</button>` : `<button class="btn btn-sm btn-outline-success" data-id="${u.user_id}" data-active="1">Activate</button>`;
        return `<tr>
          <td>${i+1}</td>
          <td>${u.name||''}</td>
          <td>${u.email||''}</td>
          <td>${u.role||''}</td>
          <td>${active}</td>
          <td>${btn}</td>
        </tr>`;
      }).join('');

      tbody.querySelectorAll('button[data-id]').forEach(btn=>{
        btn.addEventListener('click', async (e)=>{
          const id = e.currentTarget.getAttribute('data-id');
          const active = e.currentTarget.getAttribute('data-active');
          await setActive(id, active);
        });
      });
    }

    document.getElementById('btn-refresh').addEventListener('click', loadUsers);

    document.getElementById('btn-add-doctor').addEventListener('click', async ()=>{
      const payload = new FormData();
      payload.append('operation','create_user');
      payload.append('json', JSON.stringify({
        role: 'doctor',
        name: document.getElementById('doc-name').value,
        email: document.getElementById('doc-email').value,
        password: document.getElementById('doc-pass').value,
        license_number: document.getElementById('doc-license').value,
        specialization_id: document.getElementById('doc-spec').value || null,
        years_experience: document.getElementById('doc-years').value || null
      }));
      const resp = await axios.post(`${baseApiUrl}/admin_users.php`, payload);
      if (resp.data?.success) { Swal.fire('Success','Doctor created','success'); loadUsers(); } else { Swal.fire('Error', resp.data?.message||'Failed','error'); }
    });

    document.getElementById('btn-add-secretary').addEventListener('click', async ()=>{
      const payload = new FormData();
      payload.append('operation','create_user');
      payload.append('json', JSON.stringify({
        role: 'secretary',
        name: document.getElementById('sec-name').value,
        email: document.getElementById('sec-email').value,
        password: document.getElementById('sec-pass').value,
        employee_id: document.getElementById('sec-empid').value || null
      }));
      const resp = await axios.post(`${baseApiUrl}/admin_users.php`, payload);
      if (resp.data?.success) { Swal.fire('Success','Secretary created','success'); loadUsers(); } else { Swal.fire('Error', resp.data?.message||'Failed','error'); }
    });

    document.getElementById('btn-add-patient').addEventListener('click', async ()=>{
      const payload = new FormData();
      payload.append('operation','create_user');
      payload.append('json', JSON.stringify({
        role: 'patient',
        name: document.getElementById('pat-name').value,
        email: document.getElementById('pat-email').value,
        password: document.getElementById('pat-pass').value,
        contact_num: document.getElementById('pat-contact').value || null,
        birthdate: document.getElementById('pat-bdate').value || null,
        address: document.getElementById('pat-address').value || null
      }));
      const resp = await axios.post(`${baseApiUrl}/admin_users.php`, payload);
      if (resp.data?.success) { Swal.fire('Success','Patient created','success'); loadUsers(); } else { Swal.fire('Error', resp.data?.message||'Failed','error'); }
    });

    loadUsers();
  })();
</script>
