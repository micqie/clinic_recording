    <div class="row g-3">

                </div>
            </div>
        </div>
        <div class="col-lg-3 col-md-6">

            </div>
        </div>
        <div class="col-lg-3 col-md-6">
            <div class="card card-metric shadow-sm">

        </div>
        <div class="col-lg-3 col-md-6">

    <div class="card mt-4 shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span>User Management</span>
            <button id="btn-refresh" class="btn btn-sm btn-primary">Refresh</button>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-striped table-hover align-middle">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="tbl-users">
                        <tr><td colspan="5" class="text-center text-muted">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

  </div>
  </main>
</div>

<script>
  (function() {
    const baseApiUrl = sessionStorage.getItem("baseAPIUrl") || "http://localhost/clinic_recording/api";
    const userRaw = sessionStorage.getItem("user");
    let user = null;
    try { user = JSON.parse(userRaw || '{}'); } catch (e) {}

    if (!user || (user.role || '').toLowerCase() !== 'admin') {
      Swal.fire({ icon: 'error', title: 'Not Authorized', text: 'Admin access required.' }).then(() => {
        window.location.href = '../../index.html';
      });
      return;
    }

    const roleIcon = r => ({admin:'🛡️', doctor:'🩺', secretary:'🗂️', patient:'🧑‍🤝‍🧑'})[r] || '👤';

    async function loadUsers() {
      try {
        // Placeholder: reuse an existing endpoint that lists users if available in your API.
        // If none exists, this table will stay minimal until user-management API is added.
        const resp = await axios.get(baseApiUrl + '/admin_users.php?operation=list_users');
        const data = resp.data || {};
        const users = Array.isArray(data.users) ? data.users : [];
        renderUsers(users);
      } catch (e) {
        document.getElementById('tbl-users').innerHTML = '<tr><td colspan="5" class="text-center text-muted">User API not yet implemented.</td></tr>';
      }
    }

    function renderUsers(users) {
      const tbody = document.getElementById('tbl-users');
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">No users</td></tr>';
        return;
      }
      document.getElementById('metric-users').textContent = users.length;
      document.getElementById('metric-admins').textContent = users.filter(u => (u.role||'').toLowerCase()==='admin').length;
      document.getElementById('metric-doctors').textContent = users.filter(u => (u.role||'').toLowerCase()==='doctor').length;
      document.getElementById('metric-secretaries').textContent = users.filter(u => (u.role||'').toLowerCase()==='secretary').length;

      tbody.innerHTML = users.map((u,i)=>{
        const status = (u.is_active===0?'Inactive':'Active');
        return `<tr>
          <td>${i+1}</td>
          <td>${u.name || ''}</td>
          <td>${u.email || ''}</td>
          <td>${roleIcon((u.role||'').toLowerCase())} ${(u.role||'')}</td>
          <td>${status}</td>
        </tr>`;
      }).join('');
    }

    document.getElementById('btn-refresh').addEventListener('click', loadUsers);
    loadUsers();
  })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
