<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCSTUFFIN's Nurse Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="../../js/logout.js" defer></script>
    <script src="../../js/auto-logout.js" defer></script>
    <link rel="stylesheet" href="../../css/dashboard.css">
    <link rel="stylesheet" href="../../css/table.css">
    <link rel="icon" href="../../logo/apple-touch-icon.png" type="image/x-icon" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="main-navbar">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <i class="fas fa-user-nurse me-2 fs-3 text-primary"></i>
                <span class="fs-4 fw-bold text-primary">MCSTUFFIN's</span>
            </a>

            <div class="dropdown ms-auto">
                <a class="d-flex align-items-center text-decoration-none dropdown-toggle" href="#" id="nurseDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="fas fa-user-circle fa-2x text-primary me-2"></i>
                    <span class="fw-semibold">Nurse</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="nurseDropdown">
                    <li>
                        <button type="button" class="dropdown-item text-danger" id="logoutBtn">
                            <i class="fas fa-sign-out-alt me-2"></i> Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="d-flex">
        <nav id="sidebar-wrapper" role="navigation" aria-label="Sidebar menu" tabindex="0">
            <div class="list-group list-group-flush">
                <a href="nurse_dashboard.html" class="list-group-item list-group-item-action py-3 ripple active">
                    <i class="fas fa-tachometer-alt me-2" aria-hidden="true"></i>Dashboard
                </a>
                <a href="#" class="list-group-item list-group-item-action py-3 ripple" data-bs-toggle="modal" data-bs-target="#walkInModal">
                    <i class="fas fa-walking me-2" aria-hidden="true"></i>Walk-in Patient
                </a>
            </div>
        </nav>

        <main id="page-content-wrapper" class="pt-5" tabindex="-1">
            <button class="btn btn-primary d-lg-none offcanvas-toggle-btn" type="button" aria-label="Toggle menu">
                <i class="fas fa-bars"></i>
            </button>

            <div class="content-container mt-5 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1 class="fw-bold text-secondary">Nurse Dashboard</h1>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-outline-primary" id="refreshBtn">
                            <i class="fas fa-sync-alt me-2"></i>Refresh
                        </button>
                    </div>
                </div>

                <!-- Today's Appointments -->
                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <strong><i class="fas fa-calendar-day me-2"></i>Today's Appointments</strong>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="custom-table">
                                <thead>
                                    <tr>
                                        <th>Queue #</th>
                                        <th>Patient Name</th>
                                        <th>Contact</th>
                                        <th>Reason</th>
                                        <th>Doctor</th>
                                        <th>Vitals Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="appointmentsTableBody">
                                    <tr>
                                        <td colspan="6" class="text-center text-muted">Loading appointments...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Walk-in Patient Modal -->
    <div class="modal fade" id="walkInModal" tabindex="-1" aria-labelledby="walkInModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title" id="walkInModalLabel">Walk-in Patient</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="walkInForm" class="needs-validation" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Patient</label>
                                <select class="form-select" name="patient_id" required>
                                    <option value="">Select patient...</option>
                                </select>
                                <div class="invalid-feedback">Please select a patient.</div>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Reason for Visit</label>
                                <select class="form-select" name="appointment_reason_id">
                                    <option value="">Select reason...</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Other Reason (if not listed above)</label>
                                <input type="text" class="form-control" name="other_reason_text" placeholder="e.g., fever, headache, follow-up">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Additional Notes</label>
                                <textarea class="form-control" name="appointment_notes" rows="3" placeholder="Any additional information about the visit..."></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="createWalkInBtn">
                        <i class="fas fa-plus me-2"></i>Create Walk-in
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Record Vitals & History Modal -->
    <div class="modal fade" id="vitalsModal" tabindex="-1" aria-labelledby="vitalsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-info text-white">
                    <h5 class="modal-title" id="vitalsModalLabel">Record Vital Signs & History</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="vitalsForm" class="needs-validation" novalidate>
                        <input type="hidden" name="appointment_id" id="vitals_appointment_id">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Height (cm)</label>
                                <input type="number" step="0.1" class="form-control" name="height_cm" placeholder="e.g., 170.5">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Weight (kg)</label>
                                <input type="number" step="0.1" class="form-control" name="weight_kg" placeholder="e.g., 65.2">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Blood Pressure (mmHg)</label>
                                <input type="text" class="form-control" name="blood_pressure_mmHg" placeholder="e.g., 120/80">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Heart Rate (bpm)</label>
                                <input type="number" class="form-control" name="heart_rate_bpm" placeholder="e.g., 72">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">SpO₂ (%)</label>
                                <input type="number" step="0.1" class="form-control" name="spo2_percent" placeholder="e.g., 98.5">
                            </div>
                        </div>

                        <hr class="my-4" />

                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Chief Complaint</label>
                                <textarea class="form-control" name="chief_complaint" rows="2" placeholder="Primary reason for visit..."></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Past Medical History</label>
                                <textarea class="form-control" name="past_medical_history" rows="3" placeholder="Previous illnesses, surgeries, allergies..."></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Current Medications</label>
                                <textarea class="form-control" name="current_medications" rows="3" placeholder="List medicines and dosages..."></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Family History</label>
                                <textarea class="form-control" name="family_history" rows="3" placeholder="Family conditions, heredity risks..."></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Social History</label>
                                <textarea class="form-control" name="social_history" rows="3" placeholder="Smoking, alcohol, lifestyle factors..."></textarea>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-info" id="saveVitalsBtn">
                        <i class="fas fa-save me-2"></i>Save Vitals & History
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const sidebar = document.getElementById('sidebar-wrapper');
            const toggleBtn = document.querySelector('.offcanvas-toggle-btn');
            toggleBtn?.addEventListener('click', () => { sidebar.classList.toggle('show'); });
            document.addEventListener('click', (e) => {
                if (window.innerWidth <= 991.98 && sidebar.classList.contains('show') && !sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
                    sidebar.classList.remove('show');
                }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../../js/nurse_dashboard.js" defer></script>
</body>
</html>
