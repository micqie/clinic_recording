<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinic Sidebar</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .sidebar {
      width: 250px;
      height: 100vh;
      background: #2c3e50;
      color: #fff;
      padding-top: 20px;
      position: fixed;
    }

    .sidebar a {
      display: block;
      padding: 12px 20px;
      color: #ecf0f1;
      text-decoration: none;
      cursor: pointer;
    }

    .sidebar a:hover {
      background: #34495e;
    }

    .dropdown-container {
      display: none;
      background-color: #34495e;
    }

    .dropdown-container a {
      padding-left: 40px;
      font-size: 14px;
    }

    .dropdown-btn::after {
      content: "▼";
      float: right;
      margin-right: 8px;
      font-size: 12px;
    }

    .dropdown-btn.active::after {
      content: "▲";
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <a href="dashboard.php">Dashboard</a>

    <a class="dropdown-btn">Medicines</a>
    <div class="dropdown-container">
      <a href="add_medicine.php">➕ Add Medicine Form</a>
      <a href="medicine_weights.php">⚖️ Medicine Weights</a>
      <a href="medicine_inventory.php">📋 Medicine Inventory</a>
    </div>

    <a href="appointments.php">Appointments</a>
    <a href="billing.php">Billing</a>
  </div>

  <script>
    // Get all dropdown buttons
    const dropdowns = document.getElementsByClassName("dropdown-btn");
    for (let i = 0; i < dropdowns.length; i++) {
      dropdowns[i].addEventListener("click", function () {
        this.classList.toggle("active");
        const dropdownContent = this.nextElementSibling;
        dropdownContent.style.display =
          dropdownContent.style.display === "block" ? "none" : "block";
      });
    }
  </script>
</body>
</html>
